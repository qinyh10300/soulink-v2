# 全栈部署：镜像均在本地 build 并 docker save 后上传，服务器只做 load + up（无需拉取镜像）
# 工作目录建议: /opt/soulink（与 deploy.sh 中 REMOTE_DIR 一致）

services:
  postgres:
    # ports:
    #   - "127.0.0.1:15432:5432"
    image: postgres:16
    container_name: soulink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: soulink-web
      POSTGRES_USER: solink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solink -d soulink-web"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: soulink-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: soulink-api:latest
    container_name: soulink-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: :8080
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://thusoulink.com,http://localhost:5173}
      DB_DSN: ${DB_DSN:?Set DB_DSN in deploy/.env}
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-true}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PREFIX: ${REDIS_PREFIX:-soulink:}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/.env}
      JWT_TTL: ${JWT_TTL:-72h}
      VERIFICATION_CODE_TTL: ${VERIFICATION_CODE_TTL:-5m}
      VERIFICATION_CODE_COOLDOWN: ${VERIFICATION_CODE_COOLDOWN:-60s}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Soulink}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@soulink.local}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_ACCOUNTS_FILE: ${SMTP_ACCOUNTS_FILE:-}
      SOULAGENT_PROVIDER: ${SOULAGENT_PROVIDER:-}
      SOULAGENT_API_KEY: ${SOULAGENT_API_KEY:-}
      SOULAGENT_API_KEYS: ${SOULAGENT_API_KEYS:-}
      SOULAGENT_API_BASE: ${SOULAGENT_API_BASE:-}
      SOULAGENT_MODEL: ${SOULAGENT_MODEL:-}
      SOULAGENT_MODEL_POOL: ${SOULAGENT_MODEL_POOL:-}
      SOULAGENT_ROOT: /app/soulagent
      SOULAGENT_PYTHON: python3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./configs/mail:/app/configs/mail:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    image: soulink-web:latest
    container_name: soulink-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /root/ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro
      - /root/ssl/key.pem:/etc/nginx/ssl/key.pem:ro
      - /var/log/soulink-web:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
