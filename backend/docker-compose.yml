
services:
  postgres:
    image: postgres:16
    container_name: soulink-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_DB: soulink-web
      POSTGRES_USER: solink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soulink}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solink -d soulink-web"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: soulink-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:16379:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.24
    container_name: soulink-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: soulink-api:latest
    container_name: soulink-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: :8080
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://thusoulink.com,http://localhost:5173,http://203.0.113.10}
      DB_DSN: ${API_DB_DSN:-postgres://solink:${POSTGRES_PASSWORD:-soulink}@postgres:5432/soulink-web?sslmode=disable}
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-true}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PREFIX: ${REDIS_PREFIX:-soulink:}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_TTL: ${JWT_TTL:-72h}
      VERIFICATION_CODE_TTL: ${VERIFICATION_CODE_TTL:-5m}
      VERIFICATION_CODE_COOLDOWN: ${VERIFICATION_CODE_COOLDOWN:-60s}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Soulink}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@soulink.local}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_MAX_ATTEMPTS: ${SMTP_MAX_ATTEMPTS:-3}
      SMTP_ACCOUNTS_FILE: ${SMTP_ACCOUNTS_FILE:-}
      QUESTIONNAIRE_CATALOG_FILE: ${QUESTIONNAIRE_CATALOG_FILE:-thu_questionnaire_template.md}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT: ${AI_TIMEOUT:-8s}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      SOULAGENT_PROVIDER: ${SOULAGENT_PROVIDER:-}
      SOULAGENT_API_KEY: ${SOULAGENT_API_KEY:-}
      SOULAGENT_API_KEYS: ${SOULAGENT_API_KEYS:-}
      SOULAGENT_API_BASE: ${SOULAGENT_API_BASE:-}
      SOULAGENT_MODEL: ${SOULAGENT_MODEL:-}
      SOULAGENT_MODEL_POOL: ${SOULAGENT_MODEL_POOL:-}
      SOULAGENT_ENABLED: ${SOULAGENT_ENABLED:-true}
      SOULAGENT_ROOT: /app/soulagent
      SOULAGENT_PYTHON: python3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    volumes:
      - ./configs/mail:/app/configs/mail:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


volumes:
  postgres_data:
