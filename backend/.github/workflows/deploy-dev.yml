name: Deploy to Dev

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t soulink-api:latest \
            .

      - name: Save image as tar
        run: docker save soulink-api:latest -o soulink-api.tar

      - name: Upload to server and deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
          REMOTE="$USER@$HOST"
          REMOTE_DIR="/opt/soulink"

          echo ">> Uploading soulink-api.tar ..."
          scp $SSH_OPTS soulink-api.tar "$REMOTE:$REMOTE_DIR/soulink-api.tar"

          echo ">> Loading image and restarting api service ..."
          ssh $SSH_OPTS "$REMOTE" "
            cd $REMOTE_DIR
            docker load -i soulink-api.tar
            if docker compose version >/dev/null 2>&1; then
              docker compose up -d --force-recreate --no-deps api
            else
              docker-compose stop api
              docker-compose rm -f api
              docker-compose up -d --no-deps api
            fi
            docker image prune -f > /dev/null 2>&1 || true
            echo 'Deploy complete.'
          "
