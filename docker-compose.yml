services:
  postgres:
    image: postgres:16
    container_name: soulink-local-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_DB: soulink-web
      POSTGRES_USER: solink
      POSTGRES_PASSWORD: soulink
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solink -d soulink-web"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: soulink-local-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:16379:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.24
    container_name: soulink-local-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: soulink-api:local
    container_name: soulink-local-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:18081:8080"
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      ALLOWED_ORIGINS: "http://localhost:18080,http://127.0.0.1:18080,http://localhost:5173,http://127.0.0.1:5173"
      DB_DSN: "postgres://solink:soulink@postgres:5432/soulink-web?sslmode=disable"
      DB_AUTO_MIGRATE: "true"
      REDIS_ENABLED: "true"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      REDIS_PREFIX: "soulink:"
      JWT_SECRET: local-development-secret-change-me
      JWT_TTL: "72h"
      VERIFICATION_CODE_TTL: "5m"
      VERIFICATION_CODE_COOLDOWN: "60s"
      BCRYPT_COST: "10"
      MAIL_DRIVER: log
      MAIL_FROM_NAME: SouLink
      MAIL_FROM_ADDRESS: noreply@soulink.local
      SMTP_HOST: ""
      SMTP_PORT: "1025"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_ACCOUNTS_FILE: ""
      SMTP_MAX_ATTEMPTS: "3"
      QUESTIONNAIRE_CATALOG_FILE: thu_questionnaire_template.md
      MATCH_RESULT_CACHE_TTL: "24h"
      SOULAGENT_ENABLED: "false"
      SOULAGENT_PROVIDER: ""
      SOULAGENT_API_KEY: ""
      SOULAGENT_API_KEYS: ""
      SOULAGENT_API_BASE: ""
      SOULAGENT_MODEL: ""
      SOULAGENT_MODEL_POOL: ""
      SOULAGENT_ROOT: /app/soulagent
      SOULAGENT_PYTHON: python3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ./frontend
      args:
        NGINX_CONF: nginx.local/default.conf
    image: soulink-web:local
    container_name: soulink-local-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
